services:
  - type: web
    name: epg-manager
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: epg-manager-db
          property: connectionString

databases:
  - name: epg-manager-db
    databaseName: epgmanager
    user: epguser
    plan: free
    region: oregon
